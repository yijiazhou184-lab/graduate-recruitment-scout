name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Validate bundled profiles
        run: |
          python scripts/validate_profile.py assets/profile.example.json
          python scripts/validate_profile.py presets/china-2027-ai-product-hk-tech.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
